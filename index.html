<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Oscar</title>
<meta name="description" content="Interactive mockup of an 'Ask Oscar' AI chess coach inside Duolingo Chess game review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131f24;
    --bg-2: #1a272d;
    --sheet: #18252b;
    --line: #37464f;
    --text: #f1f7fb;
    --muted: #8fa3ad;
    --sq-dark: #1a262c;
    --sq-light: #25343b;
    --sq-hi: #4d4537;
    --green: #93d333;
    --green-d: #6fa524;
    --green-txt: #93d333;
    --yellow: #ffc800;
    --yellow-d: #d9a600;
    --orange: #e5a24a;
    --red: #ff4b4b;
    --blue: #1cb0f6;
    --blue-d: #1899d6;
    --pink: #f6a6d4;
    --board: 390px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% 0%, #26343b 0%, #0b1114 70%);
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 0;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }

  /* ---------- Phone ---------- */
  .device {
    padding: 12px; border-radius: 66px;
    background: linear-gradient(145deg, #3a4246, #15191b 40%, #2a3033);
    box-shadow: 0 40px 90px rgba(0,0,0,.55), inset 0 0 0 2px #4b5559;
  }
  .phone {
    position: relative; width: 390px; height: 844px; overflow: hidden;
    border-radius: 54px; background: var(--bg);
    container-type: inline-size;
    user-select: none;
  }
  @media (max-width: 500px) {
    body { padding: 0; background: var(--bg); align-items: stretch; }
    .device { padding: 0; border-radius: 0; background: none; box-shadow: none; width: 100%; }
    .phone { width: 100%; height: 100dvh; min-height: 640px; border-radius: 0; }
    .island { display: none; }
    :root { --board: 100vw; }
  }

  /* Status bar */
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 30px 0 46px; font-weight: 700; font-size: 17px; letter-spacing: -.2px;
    font-family: -apple-system, "SF Pro Text", "Nunito", sans-serif;
  }
  .status .icons { display: flex; gap: 7px; align-items: center; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 31;
  }

  /* Top bar */
  .topbar {
    position: absolute; top: 54px; left: 0; right: 0; height: 48px;
    display: flex; align-items: center; gap: 14px; padding: 0 18px 0 16px;
  }
  .close { width: 30px; height: 30px; display: grid; place-items: center; }
  .progress {
    flex: 1; height: 17px; border-radius: 10px; background: #37464f; position: relative; overflow: hidden;
  }
  .progress .fill {
    position: absolute; inset: 0 auto 0 0; width: 26%; border-radius: 10px;
    background: var(--green);
  }
  .progress .fill::after {
    content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.28);
  }
  .progress .dot { position: absolute; top: 5.5px; width: 6px; height: 6px; border-radius: 50%; background: rgba(19,31,36,.55); }
  .energy { display: flex; align-items: center; gap: 6px; color: var(--red); font-weight: 900; font-size: 19px; }

  /* Main content */
  .content { position: absolute; top: 102px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
  .header {
    flex: none; overflow: hidden; max-height: 320px; opacity: 1;
    transition: max-height .45s cubic-bezier(.3,.8,.3,1), opacity .25s;
  }
  .phone.chat-open .header { max-height: 0; opacity: 0; }
  .tag {
    margin: 10px 20px 0; display: flex; align-items: center; gap: 8px;
    color: var(--red); font-weight: 900; font-size: 17px; letter-spacing: .8px;
  }
  .title { margin: 12px 20px 0; font-size: 25px; font-weight: 900; letter-spacing: -.2px; }
  .coach-row { display: flex; align-items: flex-end; gap: 6px; padding: 6px 16px 0 14px; height: 124px; }
  .coach-row .oscar { width: 108px; height: 124px; flex: none; }
  .bubble {
    position: relative; align-self: center; margin-bottom: 16px;
    border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px;
    font-size: 17px; line-height: 1.4; font-weight: 600; color: #e9f1f5; flex: 1;
  }
  .bubble::before, .bubble::after {
    content: ""; position: absolute; left: -12px; top: 50%; margin-top: 2px;
    border: 7px solid transparent; border-right: 12px solid var(--line); border-left: 0;
  }
  .bubble::after { left: -8px; border-right-color: var(--bg); }

  /* Board */
  .board-wrap {
    flex: none; display: flex; justify-content: center; padding-top: 0;
    transition: padding .45s cubic-bezier(.3,.8,.3,1);
  }
  .phone.chat-open .board-wrap { padding-top: 8px; }
  .board {
    position: relative; width: var(--board); height: var(--board);
    transition: width .45s cubic-bezier(.3,.8,.3,1), height .45s cubic-bezier(.3,.8,.3,1), border-radius .45s;
    overflow: hidden;
  }
  .phone.chat-open .board { width: 268px; height: 268px; border-radius: 12px; }
  .squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { background: var(--sq-dark); position: relative; transition: background .3s; }
  .sq.l { background: var(--sq-light); }
  .sq.hi { background: var(--sq-hi); }
  .sq.hi-red { background: #6b3236; }
  .sq.hi-green { background: #3f5a25; }
  .piece {
    position: absolute; width: 12.5%; height: 12.5%; left: 0; top: 0;
    transition: transform .55s cubic-bezier(.4,.1,.2,1), opacity .3s;
    z-index: 2; pointer-events: none;
  }
  .piece svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .piece.w { --pc: #e4ecf0; --ps: #9fb2bc; --pd: #8aa0ab; --po: transparent; }
  .piece.b { --pc: #41606b; --ps: #2c414a; --pd: #26363d; --po: #7393a0; }
  .piece .main { fill: var(--pc); stroke: var(--po); stroke-width: 3.5; stroke-linejoin: round; }
  .piece .shade { fill: var(--ps); stroke: var(--po); stroke-width: 3.5; stroke-linejoin: round; }
  .piece .det { fill: var(--pd); }
  .piece .det-s { fill: none; stroke: var(--pd); stroke-width: 4.5; stroke-linecap: round; }
  .piece .gloss { fill: #fff; opacity: .55; }
  .piece.b .gloss { opacity: .12; }
  .piece.lift { z-index: 5; }
  .piece.gone { opacity: 0; }
  .arrows { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .arrows .arr { opacity: 0; animation: arrIn .45s .05s forwards; }
  @keyframes arrIn { from { opacity: 0; } to { opacity: 1; } }
  .sq .ring {
    position: absolute; inset: 8%; border-radius: 50%; border: 3px solid var(--red); opacity: .9;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(.88); opacity: .55; } }

  /* Feedback footer */
  .footer { margin-top: auto; padding: 0 16px 30px; }
  .verdict-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 58px; }
  .verdict { font-size: 25px; white-space: nowrap; min-width: 0; flex: 1; overflow: hidden; font-weight: 900; color: var(--orange); letter-spacing: -.2px; transition: color .3s; }
  .verdict.good { color: var(--green-txt); }
  .verdict.bad { color: var(--red); }
  .verdict.muted { color: var(--muted); }
  .ask-btn {
    display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 14px 0 5px;
    border-radius: 22px; background: var(--blue); color: #fff; flex: none; white-space: nowrap;
    font-weight: 900; font-size: 14px; letter-spacing: .6px;
    box-shadow: 0 4px 0 var(--blue-d), 0 10px 22px rgba(28,176,246,.28);
    position: relative; transform: translateY(-2px);
    animation: bob 2.6s ease-in-out infinite;
  }
  .ask-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--blue-d); }
  .ask-btn .av { width: 34px; height: 34px; border-radius: 50%; background: #fbd3ea; overflow: hidden; display: grid; place-items: end center; }
  .ask-btn .av svg { width: 40px; height: 44px; margin-bottom: -6px; }
  .ask-btn .spark {
    position: absolute; top: -7px; right: -5px; background: var(--yellow); color: #4b3800;
    font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 8px; letter-spacing: .4px;
    box-shadow: 0 2px 0 var(--yellow-d);
  }
  @container (max-width: 370px) {
    .ask-btn { font-size: 12.5px; gap: 5px; padding-right: 11px; height: 40px; }
    .ask-btn .av { width: 30px; height: 30px; }
  }
  @keyframes bob { 0%,100% { transform: translateY(-2px); } 50% { transform: translateY(-5px); } }

  .actions { display: flex; gap: 10px; align-items: stretch; justify-content: space-between; }
  .btn {
    height: 52px; border-radius: 16px; font-weight: 900; font-size: 16px; letter-spacing: .9px;
    display: grid; place-items: center; transition: transform .08s;
  }
  .btn:active { transform: translateY(3px); }
  .btn.icon { width: 56px; flex: none; border: 2.5px solid var(--orange); box-shadow: 0 3px 0 #a8742f; color: var(--orange); }
  .btn.hint { display: none; flex: 0 0 150px; border: 2.5px solid var(--line); box-shadow: 0 3px 0 var(--line); color: #c4d3da; gap: 8px; justify-content: center; align-items: center; font-size: 16px; }
  .btn.hint.used { color: #6b808a; border-color: #2a3940; box-shadow: 0 3px 0 #2a3940; }
  /* One action at a time: review → FIX MOVE, fixing → HINT, solved → NEXT HIGHLIGHT */
  .footer.fixing .btn.primary { display: none; }
  .footer.fixing .btn.hint { display: flex; }
  .footer.fixing .btn.icon { border-color: var(--line); box-shadow: 0 3px 0 var(--line); color: #6b808a; }
  .sq { cursor: pointer; }
  .sq .dot { position: absolute; left: 37%; top: 37%; width: 26%; height: 26%; border-radius: 50%; background: rgba(206,224,232,.22); }
  .sq .cap { position: absolute; inset: 5%; border-radius: 50%; border: 5px solid rgba(206,224,232,.22); }
  .btn.primary { flex: 1; background: var(--yellow); color: #2d2500; box-shadow: 0 4px 0 var(--yellow-d); }
  .footer.good .btn.icon { border-color: var(--green); box-shadow: 0 3px 0 var(--green-d); color: var(--green); }
  .footer.good .btn.primary { background: var(--green); box-shadow: 0 4px 0 var(--green-d); color: #12230a; }

  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: #fff; z-index: 40; }

  /* ---------- Chat sheet ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(5,10,12,.0); pointer-events: none; transition: background .35s; z-index: 18; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; top: 386px; z-index: 20;
    background: var(--sheet); border-radius: 26px 26px 0 0;
    border-top: 2px solid var(--line);
    box-shadow: 0 -18px 40px rgba(0,0,0,.35);
    transform: translateY(105%); transition: transform .48s cubic-bezier(.25,.9,.3,1);
    display: flex; flex-direction: column;
  }
  .phone.chat-open .sheet { transform: translateY(0); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #3c4c55; margin: 9px auto 0; flex: none; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; border-bottom: 2px solid #22323a; flex: none; }
  .sheet-head .av { width: 42px; height: 42px; border-radius: 50%; background: #fbd3ea; overflow: hidden; display: grid; place-items: end center; flex: none; }
  .sheet-head .av svg { width: 50px; height: 55px; margin-bottom: -8px; }
  .sheet-head .name { font-weight: 900; font-size: 17px; }
  .sheet-head .sub { font-size: 13px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .sheet-head .sub i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
  .sheet-head .x { margin-left: auto; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: #22323a; }

  .msgs { flex: 1; overflow-y: auto; padding: 12px 14px 6px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
  .msgs::-webkit-scrollbar { display: none; }
  .sys {
    align-self: center; font-size: 12.5px; font-weight: 800; color: var(--muted);
    background: #22323a; border-radius: 12px; padding: 6px 12px; display: flex; gap: 6px; align-items: center;
    letter-spacing: .1px;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 15.5px; line-height: 1.4; font-weight: 600; animation: pop .32s cubic-bezier(.3,1.4,.5,1); }
  .msg.o { align-self: flex-start; background: #22333b; border: 2px solid #2f414a; border-bottom-left-radius: 6px; color: #e8f0f4; }
  .msg.u { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 3px 0 var(--blue-d); font-weight: 700; }
  .msg b { font-weight: 900; color: #fff; }
  .msg .mv {
    display: inline-block; font-weight: 900; padding: 0 7px; border-radius: 7px; line-height: 1.45;
    background: rgba(255,200,0,.16); color: var(--yellow); cursor: pointer;
  }
  .msg .mv.bad { background: rgba(255,75,75,.16); color: #ff7b7b; }
  .msg .mv.ok { background: rgba(147,211,51,.16); color: var(--green); }
  .o-row { display: flex; align-items: flex-end; gap: 6px; }
  @keyframes pop { from { transform: scale(.85) translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #7d939d; animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

  .eval {
    align-self: flex-start; display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 800; color: var(--muted);
    animation: pop .32s cubic-bezier(.3,1.4,.5,1); margin-left: 2px;
  }
  .eval .bar { width: 120px; height: 8px; border-radius: 4px; background: #37464f; overflow: hidden; position: relative; }
  .eval .bar i { position: absolute; inset: 0 auto 0 0; background: var(--green); border-radius: 4px; transition: width 1s .2s cubic-bezier(.3,.8,.3,1); width: 18%; }

  .chips { display: flex; gap: 8px; padding: 8px 14px 6px; overflow-x: auto; flex: none; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 9px 14px; border-radius: 14px; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line);
    font-weight: 800; font-size: 14px; color: #d6e2e8; background: var(--sheet); white-space: nowrap;
    animation: pop .3s cubic-bezier(.3,1.4,.5,1) backwards;
  }
  .chip:active { transform: translateY(3px); box-shadow: none; }
  .chip.go { border-color: var(--green); box-shadow: 0 3px 0 var(--green-d); color: var(--green); }
  .composer { display: flex; gap: 8px; align-items: center; padding: 6px 14px 34px; flex: none; }
  .composer input {
    flex: 1; height: 46px; border-radius: 23px; border: 2px solid var(--line); background: #131f24;
    color: var(--text); font: 600 15.5px "Nunito", sans-serif; padding: 0 16px; outline: none;
  }
  .composer input::placeholder { color: #6b808a; }
  .composer input:focus { border-color: var(--blue); }
  .send { width: 46px; height: 46px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; box-shadow: 0 3px 0 var(--blue-d); flex: none; }
  .send:disabled { background: #37464f; box-shadow: 0 3px 0 #2a373e; }
</style>
</head>

<div class="device">
<div class="phone" id="phone">
  <div class="island"></div>
  <div class="status">
    <span>9:41</span>

<script>
/* ============ Chess engine ============
   0x88 board, full rules (castling, en passant, promotion, check, mate,
   stalemate, 50-move, threefold, insufficient material) and a small
   alpha-beta search with quiescence. Pieces are 'wp', 'bn', … */
const Engine = (() => {
  const FILES = 'abcdefgh';
  const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const sqName = i => FILES[i & 7] + (8 - (i >> 4));
  const sqIdx = s => (8 - +s[1]) * 16 + FILES.indexOf(s[0]);
  const VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };
  const KN = [-33, -31, -18, -14, 14, 18, 31, 33];
  const KG = [-17, -16, -15, -1, 1, 15, 16, 17];
  const BD = [-17, -15, 15, 17];
  const RD = [-16, -1, 1, 16];
  const CR = { 116: 'KQ', 119: 'K', 112: 'Q', 4: 'kq', 7: 'k', 0: 'q' };
  const MATE = 100000;

  // Piece-square tables, White's view, a8..h8 first
  const PST = {
    p: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
    n: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
    b: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
    r: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
    q: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
    k: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20],
    ke: [-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30, -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50]
  };
  const off = s => s & 0x88;
  const opp = c => (c === 'w' ? 'b' : 'w');
  const sameMove = (a, b) => !!a && !!b && a.from === b.from && a.to === b.to && (a.promo || null) === (b.promo || null);

  class Game {
    constructor(fen = START_FEN) { this.load(fen); }

    load(fen) {
      const [pos, turn, cas, ep, half, full] = fen.trim().split(/\s+/);
      this.b = new Array(128).fill(null);
      this.kings = { w: -1, b: -1 };
      let r = 0, f = 0;
      for (const ch of pos) {
        if (ch === '/') { r++; f = 0; }
        else if (/\d/.test(ch)) f += +ch;
        else {
          const c = ch === ch.toUpperCase() ? 'w' : 'b', t = ch.toLowerCase(), i = r * 16 + f;
          this.b[i] = c + t;
          if (t === 'k') this.kings[c] = i;
          f++;
        }
      }
      this.turn = turn || 'w';
      this.castle = !cas || cas === '-' ? '' : cas;
      this.ep = !ep || ep === '-' ? -1 : sqIdx(ep);
      this.half = +half || 0;
      this.full = +full || 1;
      this.stack = [];
      this.keys = [this.key()];
    }

    fen() {
      let s = '';
      for (let r = 0; r < 8; r++) {
        let e = 0;
        for (let f = 0; f < 8; f++) {
          const p = this.b[r * 16 + f];
          if (!p) { e++; continue; }
          if (e) { s += e; e = 0; }
          s += p[0] === 'w' ? p[1].toUpperCase() : p[1];
        }
        if (e) s += e;
        if (r < 7) s += '/';
      }
      return `${s} ${this.turn} ${this.castle || '-'} ${this.ep < 0 ? '-' : sqName(this.ep)} ${this.half} ${this.full}`;
    }
    key() { return this.fen().split(' ').slice(0, 4).join(' '); }
    clone() { return new Game(this.fen()); }

    attacked(i, c) {
      const b = this.b;
      if (c === 'w') { if ((!off(i + 15) && b[i + 15] === 'wp') || (!off(i + 17) && b[i + 17] === 'wp')) return true; }
      else if ((!off(i - 15) && b[i - 15] === 'bp') || (!off(i - 17) && b[i - 17] === 'bp')) return true;
      for (const d of KN) { const s = i + d; if (!off(s) && b[s] === c + 'n') return true; }
      for (const d of KG) { const s = i + d; if (!off(s) && b[s] === c + 'k') return true; }
      for (const d of BD) for (let s = i + d; !off(s); s += d) { const p = b[s]; if (p) { if (p === c + 'b' || p === c + 'q') return true; break; } }
      for (const d of RD) for (let s = i + d; !off(s); s += d) { const p = b[s]; if (p) { if (p === c + 'r' || p === c + 'q') return true; break; } }
      return false;
    }

    // Squares of colour c's pieces that attack square i
    attackers(i, c) {
      const out = [], b = this.b;
      for (const d of (c === 'w' ? [15, 17] : [-15, -17])) { const s = i + d; if (!off(s) && b[s] === c + 'p') out.push(s); }
      for (const d of KN) { const s = i + d; if (!off(s) && b[s] === c + 'n') out.push(s); }
      for (const d of KG) { const s = i + d; if (!off(s) && b[s] === c + 'k') out.push(s); }
      for (const [dirs, ts] of [[BD, 'bq'], [RD, 'rq']])
        for (const d of dirs) for (let s = i + d; !off(s); s += d) {
          const p = b[s];
          if (p) { if (p[0] === c && ts.includes(p[1])) out.push(s); break; }
        }
      return out;
    }

    inCheck(c = this.turn) { return this.attacked(this.kings[c], opp(c)); }

    pseudo(capsOnly = false) {
      const out = [], b = this.b, c = this.turn, o = opp(c);
      const add = (from, to, p, cap, flag = 'n') => out.push({ from, to, p, cap, promo: null, flag });
      for (let i = 0; i < 120; i++) {
        if (off(i)) { i += 7; continue; }
        const p = b[i];
        if (!p || p[0] !== c) continue;
        const t = p[1];
        if (t === 'p') {
          const dir = c === 'w' ? -16 : 16, startRow = c === 'w' ? 6 : 1, lastRow = c === 'w' ? 0 : 7;
          const pawnTo = (to, cap) => {
            if (to >> 4 === lastRow) for (const pr of 'qrbn') out.push({ from: i, to, p, cap, promo: pr, flag: 'p' });
            else add(i, to, p, cap);
          };
          const one = i + dir;
          if (!off(one) && !b[one]) {
            if (!capsOnly || one >> 4 === lastRow) pawnTo(one, null);
            if (!capsOnly && i >> 4 === startRow && !b[one + dir]) add(i, one + dir, p, null, 'b');
          }
          for (const s of [one - 1, one + 1]) {
            if (off(s)) continue;
            if (b[s] && b[s][0] === o) pawnTo(s, b[s]);
            else if (s === this.ep) add(i, s, p, o + 'p', 'e');
          }
        } else if (t === 'n' || t === 'k') {
          for (const d of t === 'n' ? KN : KG) {
            const s = i + d;
            if (off(s)) continue;
            const q = b[s];
            if (!q) { if (!capsOnly) add(i, s, p, null); }
            else if (q[0] === o) add(i, s, p, q);
          }
        } else {
          for (const d of t === 'b' ? BD : t === 'r' ? RD : KG)
            for (let s = i + d; !off(s); s += d) {
              const q = b[s];
              if (!q) { if (!capsOnly) add(i, s, p, null); continue; }
              if (q[0] === o) add(i, s, p, q);
              break;
            }
        }
      }
      if (!capsOnly) {
        const k = c === 'w' ? 116 : 4, K = c === 'w' ? 'K' : 'k', Q = c === 'w' ? 'Q' : 'q';
        if (this.kings[c] === k && !this.attacked(k, o)) {
          if (this.castle.includes(K) && !b[k + 1] && !b[k + 2] && b[k + 3] === c + 'r' && !this.attacked(k + 1, o) && !this.attacked(k + 2, o))
            add(k, k + 2, c + 'k', null, 'k');
          if (this.castle.includes(Q) && !b[k - 1] && !b[k - 2] && !b[k - 3] && b[k - 4] === c + 'r' && !this.attacked(k - 1, o) && !this.attacked(k - 2, o))
            add(k, k - 2, c + 'k', null, 'q');
        }
      }
      return out;
    }

    make(m) {
      const b = this.b, c = this.turn;
      this.stack.push({ m, castle: this.castle, ep: this.ep, half: this.half });
      b[m.from] = null;
      if (m.flag === 'e') b[m.to + (c === 'w' ? 16 : -16)] = null;
      b[m.to] = m.promo ? c + m.promo : m.p;
      if (m.p[1] === 'k') {
        this.kings[c] = m.to;
        if (m.flag === 'k') { b[m.to - 1] = b[m.to + 1]; b[m.to + 1] = null; }
        if (m.flag === 'q') { b[m.to + 1] = b[m.to - 2]; b[m.to - 2] = null; }
      }
      if (this.castle) for (const sq of [m.from, m.to]) if (CR[sq]) for (const ch of CR[sq]) this.castle = this.castle.replace(ch, '');
      this.ep = m.flag === 'b' ? (m.from + m.to) >> 1 : -1;
      this.half = m.p[1] === 'p' || m.cap ? 0 : this.half + 1;
      if (c === 'b') this.full++;
      this.turn = opp(c);
    }

    undo() {
      const st = this.stack.pop();
      if (!st) return null;
      const m = st.m, b = this.b, c = opp(this.turn);
      b[m.from] = m.p;
      if (m.flag === 'e') { b[m.to] = null; b[m.to + (c === 'w' ? 16 : -16)] = m.cap; }
      else b[m.to] = m.cap;
      if (m.p[1] === 'k') {
        this.kings[c] = m.from;
        if (m.flag === 'k') { b[m.to + 1] = b[m.to - 1]; b[m.to - 1] = null; }
        if (m.flag === 'q') { b[m.to - 2] = b[m.to + 1]; b[m.to + 1] = null; }
      }
      this.castle = st.castle; this.ep = st.ep; this.half = st.half;
      if (c === 'b') this.full--;
      this.turn = c;
      return m;
    }

    legal(capsOnly = false) {
      const c = this.turn, o = opp(c);
      return this.pseudo(capsOnly).filter(m => {
        this.make(m);
        const ok = !this.attacked(this.kings[c], o);
        this.undo();
        return ok;
      });
    }

    // Game-level move/takeback (tracks repetition keys)
    play(m) { this.make(m); this.keys.push(this.key()); }
    takeback() { const m = this.undo(); if (m) this.keys.pop(); return m; }

    insufficient() {
      const minors = [];
      for (let i = 0; i < 120; i++) {
        if (off(i)) { i += 7; continue; }
        const p = this.b[i];
        if (!p || p[1] === 'k') continue;
        if (p[1] === 'b' || p[1] === 'n') minors.push(p); else return false;
      }
      return minors.length <= 1;
    }

    status() {
      if (!this.legal().length) return this.inCheck() ? 'checkmate' : 'stalemate';
      if (this.half >= 100) return 'fifty';
      if (this.insufficient()) return 'insufficient';
      const k = this.keys[this.keys.length - 1];
      if (this.keys.filter(x => x === k).length >= 3) return 'repetition';
      return null;
    }

    san(m, legal = this.legal()) {
      let s;
      if (m.flag === 'k') s = 'O-O';
      else if (m.flag === 'q') s = 'O-O-O';
      else if (m.p[1] === 'p') s = (m.cap ? FILES[m.from & 7] + 'x' : '') + sqName(m.to) + (m.promo ? '=' + m.promo.toUpperCase() : '');
      else {
        s = m.p[1].toUpperCase();
        const others = legal.filter(x => x.p === m.p && x.to === m.to && x.from !== m.from);
        if (others.length) {
          if (!others.some(x => (x.from & 7) === (m.from & 7))) s += FILES[m.from & 7];
          else if (!others.some(x => x.from >> 4 === m.from >> 4)) s += 8 - (m.from >> 4);
          else s += sqName(m.from);
        }
        s += (m.cap ? 'x' : '') + sqName(m.to);
      }
      this.make(m);
      const suffix = this.inCheck() ? (this.legal().length ? '+' : '#') : '';
      this.undo();
      return s + suffix;
    }

    sanLine(moves) {
      const out = [];
      let n = 0;
      for (const m of moves) { out.push(this.san(m)); this.make(m); n++; }
      while (n--) this.undo();
      return out;
    }

    material(c) {
      let s = 0;
      for (let i = 0; i < 120; i++) {
        if (off(i)) { i += 7; continue; }
        const p = this.b[i];
        if (p && p[0] === c) s += { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 }[p[1]];
      }
      return s;
    }

    // Static evaluation from the side to move's point of view
    evaluate() {
      const b = this.b;
      let npm = 0, s = 0;
      for (let i = 0; i < 120; i++) {
        if (off(i)) { i += 7; continue; }
        const p = b[i];
        if (p && p[1] !== 'p' && p[1] !== 'k') npm += VAL[p[1]];
      }
      const kt = npm <= 2600 ? 'ke' : 'k';
      for (let i = 0; i < 120; i++) {
        if (off(i)) { i += 7; continue; }
        const p = b[i];
        if (!p) continue;
        const r = i >> 4, f = i & 7, t = p[1];
        const v = VAL[t] + PST[t === 'k' ? kt : t][(p[0] === 'w' ? r : 7 - r) * 8 + f];
        s += p[0] === 'w' ? v : -v;
      }
      return this.turn === 'w' ? s : -s;
    }
  }

  /* Iterative-deepening alpha-beta. Returns { move, score, pv, depth }
     with score from the side to move's point of view (centipawns). */
  function search(g, { maxDepth = 3, timeMs = 600 } = {}) {
    const t0 = Date.now();
    let nodes = 0, stop = false, canStop = false, prevPv = [];
    const pv = [];
    const ordered = (moves, pvMove) => {
      for (const m of moves) {
        m.o = sameMove(m, pvMove) ? 1e6 : (m.cap ? 10 * VAL[m.cap[1]] - VAL[m.p[1]] + 1000 : 0) + (m.promo ? VAL[m.promo] : 0);
      }
      return moves.sort((a, b) => b.o - a.o);
    };
    const tick = () => { if ((++nodes & 1023) === 0 && canStop && Date.now() - t0 > timeMs) stop = true; };

    function qs(alpha, beta, ply) {
      tick();
      const stand = g.evaluate();
      if (stand >= beta) return beta;
      if (stand > alpha) alpha = stand;
      if (ply > 24) return alpha;
      const c = g.turn, o = opp(c);
      for (const m of ordered(g.pseudo(true), null)) {
        g.make(m);
        if (g.attacked(g.kings[c], o)) { g.undo(); continue; }
        const sc = -qs(-beta, -alpha, ply + 1);
        g.undo();
        if (stop) return 0;
        if (sc >= beta) return beta;
        if (sc > alpha) alpha = sc;
      }
      return alpha;
    }

    function ab(depth, alpha, beta, ply) {
      pv[ply] = [];
      const c = g.turn, o = opp(c);
      const inChk = g.attacked(g.kings[c], o);
      if (inChk && ply < 8) depth++;
      if (depth <= 0) return qs(alpha, beta, ply);
      tick();
      let legal = 0;
      for (const m of ordered(g.pseudo(false), prevPv[ply])) {
        g.make(m);
        if (g.attacked(g.kings[c], o)) { g.undo(); continue; }
        legal++;
        pv[ply + 1] = [];
        const sc = -ab(depth - 1, -beta, -alpha, ply + 1);
        g.undo();
        if (stop) return 0;
        if (sc > alpha) {
          alpha = sc;
          pv[ply] = [m, ...(pv[ply + 1] || [])];
          if (alpha >= beta) return beta;
        }
      }
      if (!legal) return inChk ? -MATE + ply : 0;
      return alpha;
    }

    let result = null;
    for (let d = 1; d <= maxDepth; d++) {
      canStop = d > 1;
      const sc = ab(d, -MATE - 1, MATE + 1, 0);
      if (stop) break;
      result = { score: sc, pv: pv[0].slice(), move: pv[0][0] || null, depth: d };
      prevPv = result.pv;
      if (Math.abs(sc) > MATE - 1000) break;
    }
    if (!result || !result.move) {
      const legal = g.legal();
      result = { score: result ? result.score : 0, pv: legal.length ? [legal[0]] : [], move: legal[0] || null, depth: 0 };
    }
    return result;
  }

  return { Game, search, sqName, sqIdx, sameMove, MATE, START_FEN, VAL };
})();

/* ============ Board rendering ============ */
const FILES = 'abcdefgh';
const xy = sq => [FILES.indexOf(sq[0]), 8 - +sq[1]];
const sn = Engine.sqName;

const squaresEl = document.getElementById('squares');
const boardEl = document.getElementById('board');
const arrowsEl = document.getElementById('arrows');
const sqEls = {};
for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
  const d = document.createElement('div');
  const name = FILES[f] + (8 - r);
  d.className = 'sq' + ((r + f) % 2 === 0 ? ' l' : '');
  d.dataset.sq = name;
  squaresEl.appendChild(d);
  sqEls[name] = d;
}

let pieces = []; // {el, sq, code}
function pieceSVG(code) {
  const t = code[1];
  let det = '';
  if (t === 'n') det = '<circle class="det" cx="54" cy="30" r="4"/><path class="det-s" d="M33 44 q5 3 10 0"/>';
  if (t === 'b') det = '<path class="det-s" d="M55 31 L46 43"/>';
  if (t === 'r') det = '<rect class="det" x="38" y="25" width="24" height="7" rx="3.5"/>';
  if (t === 'k') det = '<path class="det-s" d="M36 46 q14 8 28 0"/>';
  if (t === 'q') det = '<path class="det-s" d="M38 52 q12 5 24 0"/>';
  const gloss = t === 'p' ? '<ellipse class="gloss" cx="44" cy="26" rx="4.5" ry="3.5"/>' : '<ellipse class="gloss" cx="40" cy="80" rx="8" ry="2.4"/>';
  return `<svg viewBox="0 0 100 100"><use href="#g-${t}" class="shade" transform="translate(0 5)"/><use href="#g-${t}" class="main"/>${det}${gloss}</svg>`;
}
function place(p) {
  const [x, y] = xy(p.sq);
  p.el.style.transform = `translate(${x * 100}%, ${y * 100}%)`;
}
function setPosition(pos) {
  pieces.forEach(p => p.el.remove());
  pieces = Object.entries(pos).map(([sq, code]) => {
    const el = document.createElement('div');
    el.className = 'piece ' + code[0];
    el.innerHTML = pieceSVG(code);
    el.style.transition = 'none';
    boardEl.insertBefore(el, arrowsEl);
    const p = { el, sq, code };

    requestAnimationFrame(() => requestAnimationFrame(() => el.style.transition = ''));
    return p;
  });
}
function capture(sq) {
  const victim = pieces.find(q => q.sq === sq);
  if (!victim) return;
  setTimeout(() => victim.el.classList.add('gone'), 380);
  setTimeout(() => victim.el.remove(), 700);
  pieces = pieces.filter(q => q !== victim);
}
function move(from, to) {
  const p = pieces.find(q => q.sq === from);
  if (!p) return;
  capture(to);
  p.el.classList.add('lift');
  p.sq = to; place(p);
  setTimeout(() => p.el.classList.remove('lift'), 600);
}
// Animate an engine move object on the DOM board (castling, en passant, promotion aware)
function animateMove(m) {
  if (m.flag === 'e') capture(sn(m.to + (m.p[0] === 'w' ? 16 : -16)));
  move(sn(m.from), sn(m.to));
  if (m.flag === 'k') move(sn(m.to + 1), sn(m.to - 1));
  if (m.flag === 'q') move(sn(m.to - 2), sn(m.to + 1));
  if (m.promo) {
    const p = pieces.find(q => q.sq === sn(m.to));
    if (p) setTimeout(() => { p.code = m.p[0] + m.promo; p.el.innerHTML = pieceSVG(p.code); }, 420);
  }
}
const posFromGame = g => {
  const pos = {};
  for (let i = 0; i < 120; i++) { if (i & 0x88) { i += 7; continue; } if (g.b[i]) pos[sn(i)] = g.b[i]; }
  return pos;
};

// map: { e4: 'hi', d5: 'ring', f3: 'hi dot' }
function highlight(map = {}) {
  Object.values(sqEls).forEach(el => { el.classList.remove('hi', 'hi-red', 'hi-green'); el.innerHTML = ''; });
  for (const [sq, v] of Object.entries(map)) for (const cls of v.split(' ')) {
    if (!cls) continue;
    if (cls === 'ring' || cls === 'dot' || cls === 'cap') sqEls[sq].insertAdjacentHTML('beforeend', `<div class="${cls}"></div>`);
    else sqEls[sq].classList.add(cls);
  }
}
const addHl = (map, sq, cls) => { map[sq] = map[sq] ? map[sq] + ' ' + cls : cls; return map; };

const ARROW_COLORS = { yellow: '#ffc800', red: '#ff4b4b', green: '#93d333' };
function arrows(list = []) {
  arrowsEl.innerHTML = list.map(([from, to, c]) => {
    const [x1, y1] = xy(from).map(v => v * 100 + 50);
    const [x2, y2] = xy(to).map(v => v * 100 + 50);
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const ex = x2 - Math.cos(ang) * 22, ey = y2 - Math.sin(ang) * 22;
    const h = 30, w = 0.55;
    const hx1 = ex - Math.cos(ang - w) * h, hy1 = ey - Math.sin(ang - w) * h;
    const hx2 = ex - Math.cos(ang + w) * h, hy2 = ey - Math.sin(ang + w) * h;
    const col = ARROW_COLORS[c];
    return `<g class="arr" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}"/>
      <polyline points="${hx1},${hy1} ${ex},${ey} ${hx2},${hy2}"/></g>`;
  }).join('');
}

/* ============ Game state ============
   You always play White against the engine (Black).
   Default load is the move-14 review demo: you played Ne5, but Black's
   knight on d5 was undefended — 14.Bxd5! wins it. ?new=1 starts a fresh game. */
const DEMO_FEN = 'r1q2rk1/pppb1pp1/3b3p/3n4/2BP4/5N1P/PPPBQPP1/4R1K1 w - - 0 14';
const SEARCH = { maxDepth: 4, timeMs: 600 };       // coach: best move
const REPLY_SEARCH = { maxDepth: 3, timeMs: 400 }; // coach: Black's answer to your move
const BOT = { maxDepth: 4, timeMs: 700 };          // opponent strength
const MATE_ZONE = Engine.MATE - 1000;
const PNAME = { p: 'pawn', n: 'knight', b: 'bishop', r: 'rook', q: 'queen', k: 'king' };

let game;
let mode = 'review';     // review | fixing | solved | play | over
let reviews = {};        // ply index of your move -> analysis
let redoStack = [];
let busy = false, selected = null, previewing = false;
let fixBest = null, hintMove = null, hintShown = false, lastEval = 0;

const wait = ms => new Promise(r => setTimeout(r, ms));
const phone = document.getElementById('phone');
const footer = document.getElementById('footer');
const verdict = document.getElementById('verdict');
const primaryBtn = document.getElementById('primaryBtn');
const hintBtn = document.getElementById('hintBtn');
const coachText = document.getElementById('coachText');
const titleEl = document.getElementById('title');
const tagEl = document.getElementById('tag');
const [undoBtn, redoBtn] = document.querySelectorAll('.btn.icon');

const coach = t => { coachText.textContent = t; };
const setTitle = t => { titleEl.textContent = t; };
function setVerdict(text, tone = 'warn') {
  verdict.textContent = text;
  verdict.classList.toggle('good', tone === 'good');
  verdict.classList.toggle('bad', tone === 'bad');
  verdict.classList.toggle('muted', tone === 'muted');
  fitVerdict();
}
// kind: 'fix' (yellow FIX MOVE) | 'hint' (grey HINT) | 'wait' (HINT, disabled) | 'go' (green, with label)
function setFooter(kind, label) {
  footer.classList.toggle('fixing', kind === 'hint' || kind === 'wait');
  footer.classList.toggle('good', kind === 'go');
  hintBtn.classList.toggle('used', kind === 'wait' || hintShown);
  primaryBtn.textContent = kind === 'fix' ? 'FIX MOVE' : (label || '');
}
const TAG_ICONS = {
  down: '<path d="M6 1h10v8h5L11 21 1 9h5z" fill="currentColor"/>',
  down2: '<path d="M6 0h10v7h5L11 16 1 7h5z" fill="currentColor"/><path d="M2.5 15.5L11 23l8.5-7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>',
  up: '<path d="M6 23h10v-8h5L11 3 1 15h5z" fill="currentColor"/>',
  up2: '<path d="M6 24h10v-7h5L11 8 1 17h5z" fill="currentColor"/><path d="M2.5 8.5L11 1l8.5 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>',
  even: '<rect x="2" y="6" width="18" height="4.5" rx="2.25" fill="currentColor"/><rect x="2" y="13.5" width="18" height="4.5" rx="2.25" fill="currentColor"/>'
};
function setTag(score) {
  const [label, icon, color] =
    score > 300 ? ['WAY AHEAD', 'up2', 'var(--green)'] :
    score > 100 ? ['AHEAD', 'up', 'var(--green)'] :
    score >= -100 ? ['EVEN', 'even', 'var(--muted)'] :
    score >= -300 ? ['BEHIND', 'down', 'var(--red)'] : ['WAY BEHIND', 'down2', 'var(--red)'];
  tagEl.style.color = color;
  tagEl.innerHTML = `<svg width="22" height="24" viewBox="0 0 22 24">${TAG_ICONS[icon]}</svg> ${label}`;
}

/* Keep the verdict on one line: shrink the font until it fits next to Ask Oscar */
function fitVerdict() {
  let size = verdict.classList.contains('muted') ? 20 : 25;
  verdict.style.fontSize = size + 'px';
  while (verdict.scrollWidth > verdict.clientWidth && size > 14) verdict.style.fontSize = (--size) + 'px';
}
window.addEventListener('resize', fitVerdict);
document.fonts && document.fonts.ready.then(fitVerdict);

/* ---------- Live board ---------- */
const lastMove = () => { const st = game.stack[game.stack.length - 1]; return st && st.m; };
function liveHighlights(extra = {}) {
  const map = {};
  const lm = lastMove();
  if (lm) { addHl(map, sn(lm.from), 'hi'); addHl(map, sn(lm.to), 'hi'); }
  if (game.inCheck()) addHl(map, sn(game.kings[game.turn]), 'hi-red');
  for (const [k, v] of Object.entries(extra)) addHl(map, k, v);
  return map;
}
function renderLive(anim) {
  previewing = false; selected = null;
  if (anim) {
    animateMove(anim);
    setTimeout(() => { if (!previewing && !samePieces()) setPosition(posFromGame(game)); }, 800);
  } else setPosition(posFromGame(game));
  highlight(liveHighlights());
  arrows(hintShown && hintMove ? [[sn(hintMove.from), sn(hintMove.to), 'yellow']] : []);
}
function samePieces() {
  const want = posFromGame(game);
  return pieces.length === Object.keys(want).length && pieces.every(p => want[p.sq] === p.code);
}
// Show some other position (used by Oscar's explanations); the live game is restored on the next tap
function preview(fen, hl = {}, arr = []) {
  previewing = true; selected = null;
  setPosition(posFromGame(new Engine.Game(fen)));
  highlight(hl); arrows(arr);
}

/* ---------- Coaching analysis ---------- */
const isMistake = a => !!a && (a.cls === 'better' || a.cls === 'blunder');
const VERDICT = { best: ['Best move!', 'good'], good: ['Good move', 'good'], better: ['Better move available', 'warn'], blunder: ['Big mistake', 'bad'] };

function analyze(fenBefore, m) {
  const g = new Engine.Game(fenBefore);
  const legal = g.legal();
  const mm = legal.find(x => Engine.sameMove(x, m)) || m;
  const san = g.san(mm, legal);
  const best = Engine.search(g, SEARCH);
  const bestSan = g.san(best.move, legal);
  const isBest = Engine.sameMove(best.move, mm);
  const a = {
    fenBefore, move: mm, san, isBest, moveNo: g.full,
    best: best.move, bestSan, bestScore: best.score,
    bestPv: best.pv.slice(0, 5), bestLine: g.sanLine(best.pv.slice(0, 5))
  };
  g.make(mm);
  a.fenAfter = g.fen();
  a.replyPv = []; a.replyLine = [];
  if (!g.legal().length) a.played = g.inCheck() ? Engine.MATE : 0;
  else {
    const reply = Engine.search(g, REPLY_SEARCH);
    a.played = -reply.score;
    a.replyPv = reply.pv.slice(0, 4);
    a.replyLine = g.sanLine(a.replyPv);
  }
  if (isBest) a.played = Math.max(a.played, a.bestScore);
  a.loss = isBest ? 0 : Math.max(0, a.bestScore - a.played);
  a.cls = a.loss <= 25 ? (isBest ? 'best' : 'good') : a.loss <= 300 ? 'better' : 'blunder';
  a.comment = commentFor(a);
  return a;
}
// A piece of yours that Black's best reply wins
function hangs(a) {
  const r = a.replyPv[0];
  return r && r.cap && r.cap[0] === 'w' && a.loss > 100 ? { piece: r.cap[1], sq: sn(r.to) } : null;
}
function commentFor(a) {
  if (!isMistake(a)) {
    if (a.san.endsWith('#')) return 'Checkmate! What a finish.';
    if (a.played >= MATE_ZONE) return 'Checkmate is coming — finish it!';
    if (a.move.cap) return `Nice capture — that ${PNAME[a.move.cap[1]]} is yours.`;
    if (a.move.flag === 'k' || a.move.flag === 'q') return 'Castled — your king is safe now.';
    if (a.san.endsWith('+')) return 'Check! Keep up the pressure.';
    return a.cls === 'best' ? "That's exactly what I'd play!" : 'Solid move.';
  }
  if (a.bestScore >= MATE_ZONE && a.played < MATE_ZONE) return 'There was a checkmate here!';
  if (a.played <= -MATE_ZONE) return 'Careful — this lets Black checkmate you.';
  if (a.best.cap && !a.move.cap) return 'There was a chance to capture here.';
  if (a.best.flag === 'k' || a.best.flag === 'q') return 'Castling your king would have set you up better here.';
  const h = hangs(a);
  if (h) return `Watch out — your ${PNAME[h.piece]} on ${h.sq} can be taken.`;
  return 'There was a stronger move here.';
}
function showReview(a) {
  const [t, tone] = VERDICT[a.cls];
  setVerdict(t, tone);
  coach(a.comment);
  setTag(a.played);
}
function latestReviewIndex() {
  for (let i = game.stack.length - 1; i >= 0; i--) if (game.stack[i].m.p[0] === 'w') return reviews[i] ? i : -1;
  return -1;
}
const latestReview = () => { const i = latestReviewIndex(); return i < 0 ? null : reviews[i]; };
const canFix = () => !busy && (mode === 'play' || mode === 'review') && isMistake(latestReview());

/* ---------- Turn flow ---------- */
const canUserMove = () => !busy && game.turn === 'w' && (mode === 'play' || mode === 'fixing');

async function userMove(m) {
  busy = true;
  const fenBefore = game.fen(), ply = game.stack.length;
  hintShown = false; hintMove = null;
  game.play(m); redoStack = [];
  renderLive(m);
  setFooter('wait');
  await wait(420);
  const a = analyze(fenBefore, m);

  if (mode === 'fixing') {
    if (Engine.sameMove(m, fixBest) || a.loss <= 25) {
      reviews[ply] = a;
      mode = 'solved';
      setVerdict('Best move!', 'good');
      coach(a.move.cap ? `That ${PNAME[a.move.cap[1]]} was free. Nice find!` : 'Nice find — that’s the move!');
      setTag(a.played);
      setFooter('go', 'PLAY ON');
      chatNote(`You played ${a.moveNo}. ${a.san}`);
    } else {
      setVerdict('Not quite — try again', 'warn');
      coach('Not quite. Look again — tap HINT if you’re stuck.');
      await wait(650);
      game.takeback();
      renderLive();
      setFooter('hint');
    }
    busy = false; refreshChips();
    return;
  }

  reviews[ply] = a;
  showReview(a);
  chatNote(`You played ${a.moveNo}. ${a.san}`);
  if (checkOver()) { busy = false; return; }
  await wait(250);
  botMove();
}

async function botMove() {
  busy = true;
  mode = 'play';
  setFooter('wait');
  setTitle('Black is thinking…');
  await wait(60);
  const res = Engine.search(game, BOT);
  const san = game.san(res.move), moveNo = game.full;
  game.play(res.move);
  renderLive(res.move);
  lastEval = -res.score;
  setTag(lastEval);
  chatNote(`Black played ${moveNo}… ${san}`);
  if (res.move.cap) coach(`Black took your ${PNAME[res.move.cap[1]]} on ${sn(res.move.to)}.` + (san.endsWith('+') ? ' And it’s check!' : ''));
  else if (san.endsWith('+')) coach('Check! Get your king to safety.');
  if (checkOver()) { busy = false; return; }
  setTitle('Your move');
  const a = latestReview();
  if (!a) setVerdict('Your move', 'muted');
  setFooter(isMistake(a) ? 'fix' : 'hint');
  busy = false;
  refreshChips();
}

function checkOver() {
  const st = game.status();
  if (!st) return false;
  mode = 'over';
  if (st === 'checkmate' && game.turn === 'b') {
    setTitle('You won!'); setVerdict('Checkmate!', 'good'); setTag(Engine.MATE);
    coach('Checkmate! Brilliant game — I’m proud of you.');
  } else if (st === 'checkmate') {
    setTitle('Black wins'); setVerdict('Checkmate', 'bad'); setTag(-Engine.MATE);
    coach('Checkmate. Tough one — undo a few moves and let’s see where it turned.');
  } else {
    setTitle('It’s a draw'); setVerdict('Draw', 'muted'); setTag(0);
    coach({
      stalemate: 'Stalemate — Black has no legal moves but isn’t in check, so it’s a draw.',
      fifty: '50 moves without a capture or pawn move — that’s a draw.',
      insufficient: 'Not enough pieces left to checkmate — it’s a draw.',
      repetition: 'Same position three times — that’s a draw by repetition.'
    }[st]);
  }
  setFooter('go', 'NEW GAME');
  chatNote(verdict.textContent);
  refreshChips();
  return true;
}

// Rewind to just before your last reviewed move and ask you to find the better one
function enterFix() {
  const i = latestReviewIndex();
  if (i < 0) return;
  const a = reviews[i];
  while (game.stack.length > i) game.takeback();
  redoStack = [];
  mode = 'fixing'; fixBest = a.best; hintShown = false; hintMove = null;
  renderLive();
  setTitle('Review your game');
  setVerdict('Your move', 'muted');
  coach(a.comment);
  setTag(a.played);
  setFooter('hint');
  refreshChips();
}

function newGame() {
  game = new Engine.Game();
  mode = 'play'; reviews = {}; redoStack = []; fixBest = null; hintShown = false; hintMove = null; lastEval = 0;
  renderLive();
  setTitle('Your move'); setTag(0); setVerdict('Your move', 'muted');
  coach('New game! You’re White — make your first move.');
  setFooter('hint');
  chatNote('New game started — you’re White');
  refreshChips();
}

function loadDemo() {
  game = new Engine.Game(DEMO_FEN);
  const ne5 = game.legal().find(m => sn(m.from) === 'f3' && sn(m.to) === 'e5');
  game.play(ne5);
  mode = 'review';
  renderLive();
  setTitle('Review your game');
  setVerdict('Better move available');
  coach('There was a chance to capture here.');
  tagEl.style.color = 'var(--red)';
  setFooter('fix');
  // Analyse in the background so FIX MOVE / Oscar know the real best move
  setTimeout(() => {
    const a = analyze(DEMO_FEN, ne5);
    Object.assign(a, { cls: 'better', demo: true, comment: 'There was a chance to capture here.' });
    reviews[0] = a;
  }, 80);
}

/* ---------- Controls ---------- */
primaryBtn.addEventListener('click', () => {
  if (busy) return;
  if (mode === 'solved') botMove();
  else if (mode === 'over') newGame();
  else if (mode === 'review' || mode === 'play') enterFix();
});

// HINT draws the best move as an arrow; tap its destination to play it
hintBtn.addEventListener('click', () => {
  if (!canUserMove() || hintShown) return;
  if (previewing) renderLive();
  hintMove = mode === 'fixing' && fixBest ? fixBest : Engine.search(game, SEARCH).move;
  hintShown = true;
  hintBtn.classList.add('used');
  highlight(liveHighlights({ [sn(hintMove.from)]: 'hi' }));
  arrows([[sn(hintMove.from), sn(hintMove.to), 'yellow']]);
  coach('Follow the arrow — tap the square it points to.');
});

// Undo: take back to your previous turn. Redo: replay what you took back
// (on the opening review screen, redo continues the game as you played it).
undoBtn.addEventListener('click', () => {
  if (busy || !game.stack.length) return;
  do { redoStack.push(game.takeback()); } while (game.stack.length && game.turn !== 'w');
  afterHistoryJump();
});
redoBtn.addEventListener('click', () => {
  if (busy) return;
  if (mode === 'review' && !redoStack.length) { botMove(); return; }
  if (!redoStack.length) return;
  do { game.play(redoStack.pop()); } while (redoStack.length && game.turn !== 'w');
  afterHistoryJump();
  if (mode !== 'over' && game.turn === 'b') botMove();

function reasonFor(m, san) {

  if (m.p[1] === 'p' && ['d4', 'e4', 'd5', 'e5', 'c4', 'f4'].includes(sn(m.to))) return 'It grabs space in the center.';

function answer(key) {

  if (a && a.demo && DEMO_SCRIPT[key] && (mode === 'review' || mode === 'fixing')) {

  }
  if (RULES[key]) return { replies: RULES[key]() };

      if (!a) return { replies: ["You haven't made a move yet! Play one and I'll tell you what I think."] };
      const played = mvAt(a.san, isMistake(a) ? 'bad' : 'ok', a.fenBefore, a.move);
      const best = mvAt(a.bestSan, 'ok', a.fenBefore, a.best);
      const board = () => preview(a.fenAfter, { [sn(a.move.from)]: 'hi', [sn(a.move.to)]: 'hi' },
        isMistake(a) && a.replyPv[0] ? [[sn(a.replyPv[0].from), sn(a.replyPv[0].to), 'red']] : []);

      const reply = a.replyPv[0] ? mvAt(a.replyLine[0], 'bad', a.fenAfter, a.replyPv[0]) : '';
      const h = hangs(a);

      else if (h) r.push(`${played} leaves your ${PNAME[h.piece]} on <b>${h.sq}</b> unprotected. Black can answer ${reply} and win it.`);
      else r.push(`${played} isn't a disaster, but it gives Black an easy game${reply ? ` — ${reply} is a strong reply` : ''}.`);
      if (a.bestScore >= MATE_ZONE) r.push(`And you had a checkmate! ${best} starts it.`);
      else if (a.best.cap && !a.move.cap) r.push(`There was a ${PNAME[a.best.cap[1]]} to capture with ${best}. Rule of thumb: <b>before every move, check for captures</b>.`);
      else if (a.best.flag === 'k' || a.best.flag === 'q') r.push(`Castling with ${best} would have tucked your king away safely.`);
      else r.push(`${best} was stronger — it's worth about <b>${(a.loss / 100).toFixed(1)}</b> pawns more.`);
      return { replies: r, board };
    }
    case 'best': {
      if (!a) return { replies: ['Make a move first, then I can compare it to the best one!'] };
      const best = mvAt(a.bestSan, 'ok', a.fenBefore, a.best);
      const board = () => preview(a.fenBefore, { [sn(a.best.from)]: 'hi', [sn(a.best.to)]: 'ring' }, [[sn(a.best.from), sn(a.best.to), 'yellow']]);
      if (a.isBest) return { replies: [`You already found it — ${best} was the best move! 🎉`, reasonFor(a.best, a.bestSan)], board };
      return {
        replies: [`${best} — ${reasonFor(a.best, a.bestSan).replace(/^It /, 'it ')}`,

            ? `The difference is about <b>${(a.loss / 100).toFixed(1)}</b> pawns — small things add up!`
            : `With it, ${standing(a.bestScore)}. After your move, you were ${phrase(a.played)}.`],
        evalBar: [cap1(phrase(a.played)), cap1(phrase(a.bestScore)), pct(a.played), pct(a.bestScore)],

    case 'line': {

      const sans = useBest ? a.bestLine : [a.san, ...a.replyLine].slice(0, 5);
      return {
        replies: [`Watch the board 👀 ${lineChips(a.fenBefore, moves, sans)}`,
          useBest ? `That's the line with best play — ${standing(a.bestScore)}.${canFix() ? ' Want to try playing it yourself?' : ''}`

      const r = Engine.search(game, SEARCH);
      const san = game.san(r.move);

        replies: [`I like ${mvAt(san, 'ok', game.fen(), r.move)} here.`, reasonFor(r.move, san) + ' Tap the square the arrow points to if you want to play it.'],

      if (game.inCheck()) {

      const base = g.evaluate();
      const r = Engine.search(g, REPLY_SEARCH);
      if (!r.move) return { replies: ['Black has no real moves to make — no threats!'] };
      const san = g.san(r.move), chip = mvAt(san, 'bad', g.fen(), r.move);
      const board = () => { renderLive(); arrows([[sn(r.move.from), sn(r.move.to), 'red']]); };
      if (r.score >= MATE_ZONE) return { replies: [`Black is threatening <b>checkmate</b> with ${chip}! Find a way to stop it.`], board };
      if (r.move.cap && r.score - base > 80) return { replies: [`Black wants to play ${chip}, winning your ${PNAME[r.move.cap[1]]} on ${sn(r.move.to)}.`, 'Protect it, move it, or create a bigger threat of your own!'], board };
      return { replies: [`No big threats right now. 👍 Black's best idea is ${chip}, but it doesn't win anything yet.`], board };
    }
    case 'eval': {
      const s = mode === 'over' ? (game.status() === 'checkmate' ? (game.turn === 'b' ? Engine.MATE : -Engine.MATE) : 0)

  };
}

function route(text) {
  const t = text.toLowerCase();
  if (/(new game|restart|start over|play again)/.test(t)) return 'new';
  if (/(take ?back|undo)/.test(t)) return 'undo';
  if (/\bwhy\b/.test(t) && !/castl|passant|promot/.test(t)) return 'why';
  if (/castl/.test(t)) return 'castle';
  if (/passant/.test(t)) return 'ep';
  if (/promot/.test(t)) return 'promo';
  if (/stalemate/.test(t)) return 'stalemate';
  if (/(draw|repetition|50.move|fifty)/.test(t)) return 'draw';
  if (/(worth|value|points)/.test(t) && !/winning/.test(t)) return 'values';
  if (/(opening|how (do|should) i start|tips)/.test(t)) return 'opening';
  const pm = t.match(/(how|where|can).*\b(pawn|knight|bishop|rook|queen|king)s?\b|\b(pawn|knight|bishop|rook|queen|king)s? (move|go)/);
  if (pm) return { pawn: 'p', knight: 'n', bishop: 'b', rook: 'r', queen: 'q', king: 'k' }[pm[2] || pm[3]];
  if (/(threat|threaten|attacking me|danger|watch out|check\b)/.test(t)) return 'threat';
  if (/(checkmate|what is mate)/.test(t)) return 'mate';
  if (/(winning|losing|who.?s ahead|score|eval|am i (ahead|behind))/.test(t)) return 'eval';
  if (/(hang|loose|undefended|safe)/.test(t)) return 'hanging';
  if (/(what should i|what now|what do i do|hint|help me|my move|suggest|what can i)/.test(t)) return 'now';
  if (/(line|show|then|after|next|continu|play out)/.test(t)) return 'line';
  if (/(best|better|should have|instead|right move|correct)/.test(t)) return 'best';
  if (/(weak|wrong|bad|mistake|blunder|good move|was that|how did i)/.test(t)) return 'why';
  return 'fallback';
}

function contextChips() {
  const a = latestReview();
  if (mode === 'over') return ['new', 'eval'];
  let list = a && a.demo && isMistake(a) && mode !== 'play' ? ['why', 'best', 'line']
    : isMistake(a) ? ['why', 'best', 'line', 'threat']
    : a ? ['good', 'now', 'threat', 'eval']
    : ['now', 'castle', 'eval'];
  list = list.filter(k => !asked.has(k));
  if (isMistake(a) && (asked.has('best') || asked.has('line')) && canFix()) list.unshift('try');
  if (!list.length) list = ['now', 'hanging', 'eval'].filter(k => !asked.has(k));
  if (!list.length) list = ['now', 'threat'];
  return list.slice(0, 4);
}
function contextLine() {
  const a = latestReview();

      addSys(contextLine());
      await oscarSays(chatCtx ? "Hey! Let's look at this one together. What do you want to know? 🤔"
                              : "Hey! I'm watching your game. Ask me about your moves, threats, or the rules. 🤔", 800);
      setChips(contextChips());
    }, 450);
  } else if (latestReview() !== chatCtx) {
    addSys(contextLine());
    refreshChips();
  }
}
function closeChat() {
  phone.classList.remove('chat-open');
  input.blur();
  if (previewing) renderLive();
}
function tryIt() {
  closeChat();
  setTimeout(() => {
    if (!canFix()) return;
    const a = latestReview();
    enterFix();
    coach(a.best.cap ? 'Your turn — find the capture!' : 'Your turn — find the better move!');
  }, 300);
}

document.getElementById('askBtn').addEventListener('click', openChat);
document.getElementById('closeChat').addEventListener('click', closeChat);
input.addEventListener('input', () => sendBtn.disabled = !input.value.trim());
document.getElementById('composer').addEventListener('submit', e => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v || chatBusy) return;
  input.value = ''; sendBtn.disabled = true;
  ask(route(v), v.replace(/&/g, '&amp;').replace(/</g, '&lt;'));
});
// Tap a move tag in a bubble to see it on the board
msgs.addEventListener('click', e => {
  const m = e.target.closest('.mv');
  if (!m) return;
  if (m.dataset.fen) {
    const f = m.dataset.m.slice(0, 2), t = m.dataset.m.slice(2, 4);
    preview(m.dataset.fen, { [f]: 'hi', [t]: 'hi' }, [[f, t, m.classList.contains('bad') ? 'red' : 'yellow']]);
    return;
  }
  const txt = m.textContent;
  if (/Bxd5/.test(txt)) preview(DEMO_FEN, { c4: 'hi', d5: 'ring' }, [['c4', 'd5', 'yellow']]);
  else if (/Nf4|Ne5/.test(txt)) DEMO_SCRIPT.why.board();
});

/* ============ Start ============
   ?new=1 starts a fresh game from the opening; ?chat=1 opens Oscar right away */
const params = new URLSearchParams(location.search);
if (params.get('new')) newGame(); else loadDemo();
fitVerdict();
if (params.get('chat')) openChat();
</script>
